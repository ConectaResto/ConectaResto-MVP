<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">C4 — Diagrama de Contexto</text>

  <!-- Actors (persons) -->
  <rect x="50" y="80" width="160" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="130" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Cliente público</text>
  <text x="130" y="130" font-family="Arial" font-size="11" text-anchor="middle">Sin autenticación</text>

  <rect x="270" y="80" width="160" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="350" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mesero (WAITER)</text>

  <rect x="490" y="80" width="160" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="570" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Cocina (KITCHEN)</text>

  <rect x="710" y="80" width="160" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="790" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Caja (CASHIER)</text>

  <rect x="50" y="220" width="160" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="130" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Administrador (ADMIN)</text>

  <!-- System -->
  <rect x="250" y="300" width="400" height="140" fill="#fff3e0" stroke="#ff9800" stroke-width="3" rx="12"/>
  <text x="450" y="330" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">ConectaResto-MVP</text>
  <text x="450" y="355" font-family="Arial" font-size="12" text-anchor="middle">Flask + MySQL 8 — Restaurante único</text>
  <text x="450" y="380" font-family="Arial" font-size="11" text-anchor="middle">API REST, autenticación, CSRF, menú público, QR</text>
  <text x="450" y="405" font-family="Arial" font-size="11" text-anchor="middle">Pedidos, cocina, caja, pagos simulados</text>

  <!-- Relationships -->
  <line x1="130" y1="150" x2="250" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="150" x2="300" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="150" x2="450" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="150" x2="600" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="290" x2="200" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels on relationships -->
  <text x="180" y="140" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Escanea QR, consulta menú, pide</text>
  <text x="320" y="140" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Gestiona pedidos, mesas</text>
  <text x="450" y="140" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Prepara pedidos</text>
  <text x="650" y="140" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Registra pagos, cierra caja</text>
  <text x="150" y="285" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Gestiona usuarios, productos, mesas</text>
</svg>
