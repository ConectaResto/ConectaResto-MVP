<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Diagrama de Secuencia — Pedido QR hasta Cierre de Servicio</text>

  <!-- Participant lifelines -->
  <!-- Cliente -->
  <line x1="80" y1="90" x2="80" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="70" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Cliente</text>

  <!-- Navegador/SPA -->
  <line x1="220" y1="90" x2="220" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="210" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Navegador (SPA)</text>

  <!-- Flask App -->
  <line x1="400" y1="90" x2="400" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="390" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Flask App</text>

  <!-- MySQL -->
  <line x1="560" y1="90" x2="560" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="550" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">MySQL 8</text>

  <!-- Mesero -->
  <line x1="720" y1="90" x2="720" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="710" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Mesero</text>

  <!-- Cocina -->
  <line x1="860" y1="90" x2="860" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="850" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Cocina</text>

  <!-- Caja -->
  <line x1="1000" y1="90" x2="1000" y2="760" stroke="#666666" stroke-width="1"/>
  <text x="990" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Caja</text>

  <!-- ============================================================ -->
  <!-- ETAPA 1: Cliente escanea QR, consulta menú y confirma pedido -->
  <!-- ============================================================ -->
  <text x="550" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">1. Cliente escanea QR, consulta menú y confirma pedido</text>

  <line x1="100" y1="120" x2="400" y2="120" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="114" font-family="Arial" font-size="10" fill="#333333">Abrir QR, ver menú</text>

  <line x1="400" y1="140" x2="560" y2="140" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="134" font-family="Arial" font-size="10" fill="#333333">Consultar mesa por token</text>

  <line x1="400" y1="160" x2="220" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="154" font-family="Arial" font-size="10" fill="#333333">HTML del menú (Jinja2)</text>

  <line x1="100" y1="180" x2="400" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="174" font-family="Arial" font-size="10" fill="#333333">Confirmar pedido (carrito)</text>

  <line x1="400" y1="200" x2="560" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="194" font-family="Arial" font-size="10" fill="#333333">Crear pedido (PENDIENTE)</text>

  <line x1="400" y1="220" x2="220" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="214" font-family="Arial" font-size="10" fill="#333333">201 {id, estado}</text>

  <!-- ============================================================ -->
  <!-- ETAPA 2: Mesero autoriza el pedido -->
  <!-- ============================================================ -->
  <text x="550" y="260" font-family="Arial" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">2. Mesero autoriza el pedido</text>

  <line x1="720" y1="280" x2="400" y2="280" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="274" font-family="Arial" font-size="10" fill="#333333">POST /pedidos/&lt;id&gt;/autorizar</text>

  <line x1="400" y1="300" x2="560" y2="300" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="294" font-family="Arial" font-size="10" fill="#333333">Bloquear fila, verificar PENDIENTE</text>

  <line x1="400" y1="320" x2="720" y2="320" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="314" font-family="Arial" font-size="10" fill="#333333">Pedido autorizado</text>

  <!-- ============================================================ -->
  <!-- ETAPA 3: Cocina prepara el pedido -->
  <!-- ============================================================ -->
  <text x="550" y="360" font-family="Arial" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">3. Cocina prepara el pedido</text>

  <line x1="720" y1="380" x2="400" y2="380" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="374" font-family="Arial" font-size="10" fill="#333333">POST /pedidos/&lt;id&gt;/enviar-cocina</text>

  <line x1="400" y1="400" x2="560" y2="400" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="394" font-family="Arial" font-size="10" fill="#333333">Estado → EN_PREPARACION</text>

  <line x1="400" y1="420" x2="860" y2="420" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="414" font-family="Arial" font-size="10" fill="#333333">Notificar a cocina</text>

  <line x1="860" y1="440" x2="400" y2="440" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="434" font-family="Arial" font-size="10" fill="#333333">PATCH /preparacion (LISTO_PARA_SERVIR)</text>

  <line x1="400" y1="460" x2="560" y2="460" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="454" font-family="Arial" font-size="10" fill="#333333">Pedido LISTO</text>

  <line x1="400" y1="480" x2="720" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="474" font-family="Arial" font-size="10" fill="#333333">Pedido listo para servir</text>

  <!-- ============================================================ -->
  <!-- ETAPA 4: Mesero entrega el pedido -->
  <!-- ============================================================ -->
  <text x="550" y="520" font-family="Arial" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">4. Mesero entrega el pedido</text>

  <line x1="720" y1="540" x2="400" y2="540" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="534" font-family="Arial" font-size="10" fill="#333333">POST /pedidos/&lt;id&gt;/entregar</text>

  <line x1="400" y1="560" x2="560" y2="560" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="554" font-family="Arial" font-size="10" fill="#333333">Pedido ENTREGADO</text>

  <line x1="400" y1="580" x2="720" y2="580" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="574" font-family="Arial" font-size="10" fill="#333333">Pedido entregado</text>

  <!-- ============================================================ -->
  <!-- ETAPA 5: Caja registra pago y cierra servicio -->
  <!-- ============================================================ -->
  <text x="550" y="620" font-family="Arial" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">5. Caja registra pago y cierra servicio</text>

  <line x1="1000" y1="640" x2="400" y2="640" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="634" font-family="Arial" font-size="10" fill="#333333">POST /servicios/&lt;id&gt;/pago-simulado</text>

  <line x1="400" y1="660" x2="560" y2="660" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="654" font-family="Arial" font-size="10" fill="#333333">Registrar pago (importe)</text>

  <line x1="400" y1="680" x2="1000" y2="680" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="674" font-family="Arial" font-size="10" fill="#333333">Pago registrado</text>

  <line x1="1000" y1="700" x2="400" y2="700" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="694" font-family="Arial" font-size="10" fill="#333333">POST /servicios/&lt;id&gt;/cerrar</text>

  <line x1="400" y1="720" x2="560" y2="720" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="714" font-family="Arial" font-size="10" fill="#333333">Servicio cerrado, mesa DISPONIBLE</text>

  <line x1="400" y1="740" x2="1000" y2="740" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="734" font-family="Arial" font-size="10" fill="#333333">Servicio cerrado</text>
</svg>
