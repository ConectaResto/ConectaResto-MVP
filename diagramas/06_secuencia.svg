<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="750" viewBox="0 0 950 750">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Diagrama de Secuencia — Pedido QR hasta Cierre de Servicio</text>

  <!-- Participants (actors/systems) -->
  <line x1="50" y1="80" x2="50" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="40" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Cliente</text>

  <line x1="150" y1="80" x2="150" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="140" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Navegador</text>

  <line x1="350" y1="80" x2="350" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="340" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Flask App</text>

  <line x1="450" y1="80" x2="450" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="440" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">MySQL 8</text>

  <line x1="550" y1="80" x2="550" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="540" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Mesero</text>

  <line x1="650" y1="80" x2="650" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="640" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Cocina</text>

  <line x1="750" y1="80" x2="750" y2="650" stroke="#666666" stroke-width="1"/>
  <text x="740" y="60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="end">Caja</text>

  <!-- Messages -->
  <!-- 1: Abre URL QR -->
  <line x1="100" y1="100" x2="350" y2="100" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="92" font-family="Arial" font-size="10" fill="#333333">1. Abre URL del QR (menú público)</text>

  <!-- 2: GET /public/mesas/<token>/menu -->
  <line x1="350" y1="120" x2="450" y2="120" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="112" font-family="Arial" font-size="10" fill="#333333">2. GET /public/mesas/<token>/menu</text>

  <!-- 3: Consultar mesa -->
  <line x1="450" y1="140" x2="450" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="152" font-family="Arial" font-size="10" fill="#333333">3. Consultar mesa por token</text>

  <!-- 4: Datos de mesa -->
  <line x1="450" y1="180" x2="450" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="192" font-family="Arial" font-size="10" fill="#333333">4. Devuelve datos de mesa</text>

  <!-- 5: HTML del menú -->
  <line x1="350" y1="220" x2="150" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="212" font-family="Arial" font-size="10" fill="#333333">5. HTML del menú (Jinja2)</text>

  <!-- 6: Confirma pedido -->
  <line x1="100" y1="240" x2="350" y2="240" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="232" font-family="Arial" font-size="10" fill="#333333">6. Confirma pedido (carrito)</text>

  <!-- 7: POST /public/mesas/<token>/pedidos -->
  <line x1="350" y1="260" x2="450" y2="260" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="252" font-family="Arial" font-size="10" fill="#333333">7. POST /public/mesas/<token>/pedidos (CSRF)</text>

  <!-- 8: Buscar servicio ACTIVO -->
  <line x1="450" y1="280" x2="450" y2="300" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="292" font-family="Arial" font-size="10" fill="#333333">8. Buscar servicio ACTIVO</text>

  <!-- 9: Crear servicio si no existe -->
  <line x1="450" y1="320" x2="450" y2="340" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="332" font-family="Arial" font-size="10" fill="#333333">9. Crear servicio (mesa DISPONIBLE→OCUPADA)</text>

  <!-- 10: Crear pedido -->
  <line x1="450" y1="360" x2="450" y2="380" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="372" font-family="Arial" font-size="10" fill="#333333">10. Crear pedido (PENDIENTE)</text>

  <!-- 11: Respuesta 201 -->
  <line x1="350" y1="400" x2="150" y2="400" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="392" font-family="Arial" font-size="10" fill="#333333">11. 201 {id, estado}</text>

  <!-- 12: Mesero autoriza -->
  <line x1="550" y1="420" x2="350" y2="420" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="412" font-family="Arial" font-size="10" fill="#333333">12. POST /pedidos/<id>/autorizar</text>

  <!-- 13: Bloquear fila -->
  <line x1="350" y1="440" x2="450" y2="440" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="432" font-family="Arial" font-size="10" fill="#333333">13. Bloquear fila del servicio</text>

  <!-- 14: Estado PENDIENTE -->
  <line x1="450" y1="460" x2="450" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="472" font-family="Arial" font-size="10" fill="#333333">14. Verificar estado PENDIENTE</text>

  <!-- 15: Pedido autorizado -->
  <line x1="350" y1="500" x2="550" y2="500" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="492" font-family="Arial" font-size="10" fill="#333333">15. Pedido autorizado</text>

  <!-- 16: Mesero envía a cocina -->
  <line x1="550" y1="520" x2="350" y2="520" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="512" font-family="Arial" font-size="10" fill="#333333">16. POST /pedidos/<id>/enviar-cocina</text>

  <!-- 17: Estado EN_PREPARACION -->
  <line x1="350" y1="540" x2="450" y2="540" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="532" font-family="Arial" font-size="10" fill="#333333">17. Estado → EN_PREPARACION</text>

  <!-- 18: Cocina: RECIBIDO -->
  <line x1="450" y1="560" x2="650" y2="560" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="552" font-family="Arial" font-size="10" fill="#333333">18. Preparación → RECIBIDO</text>

  <!-- 19: Cocina: EN_COCINA -->
  <line x1="650" y1="580" x2="350" y2="580" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="572" font-family="Arial" font-size="10" fill="#333333">19. PATCH /preparacion (EN_COCINA)</text>

  <!-- 20: Cocina: LISTO_PARA_SERVIR -->
  <line x1="350" y1="600" x2="450" y2="600" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="592" font-family="Arial" font-size="10" fill="#333333">20. PATCH /preparacion (LISTO_PARA_SERVIR)</text>

  <!-- 21: Pedido LISTO -->
  <line x1="450" y1="620" x2="650" y2="620" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="612" font-family="Arial" font-size="10" fill="#333333">21. Pedido → LISTO</text>

  <!-- 22: Mesero entrega -->
  <line x1="550" y1="640" x2="350" y2="640" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="632" font-family="Arial" font-size="10" fill="#333333">22. POST /pedidos/<id>/entregar</text>

  <!-- 23: Pedido ENTREGADO -->
  <line x1="350" y1="660" x2="450" y2="660" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="652" font-family="Arial" font-size="10" fill="#333333">23. Pedido → ENTREGADO</text>

  <!-- 24: Caja paga -->
  <line x1="750" y1="680" x2="350" y2="680" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="672" font-family="Arial" font-size="10" fill="#333333">24. POST /servicios/<id>/pago-simulado</text>

  <!-- 25: Caja cierra -->
  <line x1="750" y1="700" x2="350" y2="700" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="692" font-family="Arial" font-size="10" fill="#333333">25. POST /servicios/<id>/cerrar</text>

  <!-- 26: Mesa DISPONIBLE -->
  <line x1="350" y1="720" x2="550" y2="720" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="712" font-family="Arial" font-size="10" fill="#333333">26. Mesa → DISPONIBLE</text>
</svg>
