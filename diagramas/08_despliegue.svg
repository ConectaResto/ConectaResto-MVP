<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Diagrama de Despliegue Local</text>

  <!-- Machine node -->
  <rect x="50" y="80" width="800" height="340" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="10"/>
  <text x="450" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Máquina local (Windows 11)</text>

  <!-- Browser -->
  <rect x="100" y="150" width="200" height="90" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="200" y="175" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Navegador web</text>
  <text x="200" y="195" font-family="Arial" font-size="11" text-anchor="middle">Chrome / Edge</text>
  <text x="200" y="215" font-family="Arial" font-size="10" text-anchor="middle">localhost:5000</text>

  <!-- Flask Server -->
  <rect x="350" y="150" width="200" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="450" y="175" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Servidor Flask</text>
  <text x="450" y="195" font-family="Arial" font-size="11" text-anchor="middle">Python 3 + Flask 3</text>
  <text x="450" y="215" font-family="Arial" font-size="10" text-anchor="middle">localhost:5000</text>
  <text x="450" y="235" font-family="Arial" font-size="10" text-anchor="middle">Sin debugger/reload</text>

  <!-- MySQL -->
  <rect x="600" y="150" width="200" height="120" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="700" y="175" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">MySQL 8</text>
  <text x="700" y="195" font-family="Arial" font-size="11" text-anchor="middle">MySQL Community 8.0.46</text>
  <text x="700" y="215" font-family="Arial" font-size="10" text-anchor="middle">localhost:3306</text>
  <text x="700" y="235" font-family="Arial" font-size="10" text-anchor="middle">Base: conectaresto_mvp</text>

  <!-- Filesystem -->
  <rect x="350" y="290" width="200" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
  <text x="450" y="315" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Sistema de archivos</text>
  <text x="450" y="335" font-family="Arial" font-size="11" text-anchor="middle">instance/uploads/products/</text>
  <text x="450" y="355" font-family="Arial" font-size="10" text-anchor="middle">Imágenes de productos</text>

  <!-- Relationships -->
  <line x1="200" y1="240" x2="350" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="230" font-family="Arial" font-size="10" fill="#666666">HTTP</text>

  <line x1="450" y1="270" x2="450" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="275" font-family="Arial" font-size="10" fill="#666666">PyMySQL / SQLAlchemy</text>

  <line x1="550" y1="270" x2="450" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="275" font-family="Arial" font-size="10" fill="#666666">(DATABASE_URL)</text>

  <line x1="450" y1="230" x2="450" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="240" font-family="Arial" font-size="10" fill="#666666">Lectura/escritura</text>

  <!-- Note -->
  <rect x="50" y="340" width="800" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="80" y="365" font-family="Arial" font-size="12" font-weight="bold">Variables de entorno:</text>
  <text x="80" y="385" font-family="Arial" font-size="11">SECRET_KEY · DATABASE_URL · PUBLIC_BASE_URL · FLASK_ENV</text>
  <text x="80" y="405" font-family="Arial" font-size="11">Archivo .env no se sube al repositorio (.gitignore)</text>
</svg>
