<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Arquitectura por Capas</text>

  <!-- Layer 1: Presentación -->
  <rect x="50" y="70" width="800" height="70" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="6"/>
  <text x="80" y="95" font-family="Arial" font-size="14" font-weight="bold">Capa de Presentación</text>
  <text x="80" y="120" font-family="Arial" font-size="11">SPA frontend/ · HTML5, CSS3, JavaScript Vanilla, Bootstrap 5</text>
  <text x="80" y="135" font-family="Arial" font-size="11">Blueprints Flask (routes.py) · Plantillas Jinja2 (app/templates/)</text>

  <!-- Layer 2: API REST -->
  <rect x="50" y="170" width="800" height="70" fill="#fff9c4" stroke="#ffc107" stroke-width="2" rx="6"/>
  <text x="80" y="195" font-family="Arial" font-size="14" font-weight="bold">Capa de API REST</text>
  <text x="80" y="220" font-family="Arial" font-size="11">Endpoints Flask: auth, users, catalog, mesas, servicios, pedidos</text>

  <!-- Layer 3: Aplicación (Services) -->
  <rect x="50" y="260" width="800" height="90" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="80" y="285" font-family="Arial" font-size="14" font-weight="bold">Capa de Aplicación (Services)</text>
  <text x="80" y="310" font-family="Arial" font-size="11">auth.service · users.service · catalog.service · servicios.service · pedidos.service</text>

  <!-- Layer 4: Acceso a Datos (Repositorios) -->
  <rect x="50" y="370" width="800" height="70" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="80" y="395" font-family="Arial" font-size="14" font-weight="bold">Capa de Acceso a Datos (Repositorios)</text>
  <text x="80" y="420" font-family="Arial" font-size="11">pedidos.repository (PedidoRepository) · servicios.repository (ServicioRepository)</text>

  <!-- Layer 5: DTO -->
  <rect x="50" y="460" width="800" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="6"/>
  <text x="80" y="485" font-family="Arial" font-size="14" font-weight="bold">Capa de Transferencia (DTO)</text>
  <text x="80" y="505" font-family="Arial" font-size="11">pedidos.dto (PedidoDTO) · servicios.dto (ServicioDTO)</text>

  <!-- Layer 6: Dominio -->
  <rect x="50" y="530" width="800" height="70" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="6"/>
  <text x="80" y="555" font-family="Arial" font-size="14" font-weight="bold">Capa de Dominio (Modelos y Reglas)</text>
  <text x="80" y="580" font-family="Arial" font-size="11">Modelos SQLAlchemy (app/models/) · Reglas de negocio · Validaciones de dominio</text>

  <!-- Layer 7: Datos -->
  <rect x="50" y="620" width="800" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="2" rx="6"/>
  <text x="80" y="645" font-family="Arial" font-size="14" font-weight="bold">Capa de Datos</text>
  <text x="80" y="670" font-family="Arial" font-size="11">MySQL 8 · Flask-Migrate (migraciones 001-014)</text>

  <!-- Flow arrows between layers -->
  <line x1="450" y1="140" x2="450" y2="170" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="230" x2="450" y2="260" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="340" x2="450" y2="370" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="420" x2="450" y2="460" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="500" x2="450" y2="530" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="590" x2="450" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
