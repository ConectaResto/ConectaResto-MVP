<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="750" viewBox="0 0 950 750">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Modelo de Datos MySQL (ER Simplificado)</text>

  <!-- roles -->
  <rect x="40" y="60" width="150" height="90" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="115" y="80" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">roles</text>
  <text x="115" y="100" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="115" y="115" font-family="Arial" font-size="9" text-anchor="middle">name: string UK</text>
  <text x="115" y="130" font-family="Arial" font-size="9" text-anchor="middle">description: text</text>

  <!-- usuarios -->
  <rect x="250" y="60" width="160" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="330" y="80" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">usuarios</text>
  <text x="330" y="100" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="330" y="115" font-family="Arial" font-size="9" text-anchor="middle">username: string UK</text>
  <text x="330" y="130" font-family="Arial" font-size="9" text-anchor="middle">email: string UK</text>
  <text x="330" y="145" font-family="Arial" font-size="9" text-anchor="middle">password_hash: string</text>
  <text x="330" y="160" font-family="Arial" font-size="9" text-anchor="middle">rol_id: int FK</text>
  <text x="330" y="175" font-family="Arial" font-size="9" text-anchor="middle">is_active: boolean</text>

  <!-- categories -->
  <rect x="470" y="60" width="150" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="545" y="80" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">categories</text>
  <text x="545" y="100" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="545" y="115" font-family="Arial" font-size="9" text-anchor="middle">name: string UK</text>
  <text x="545" y="130" font-family="Arial" font-size="9" text-anchor="middle">collation utf8mb4_0900_ai_ci</text>
  <text x="545" y="145" font-family="Arial" font-size="9" text-anchor="middle">description: string</text>
  <text x="545" y="160" font-family="Arial" font-size="9" text-anchor="middle">is_active: boolean</text>

  <!-- products -->
  <rect x="680" y="60" width="150" height="130" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="755" y="80" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">products</text>
  <text x="755" y="100" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="755" y="115" font-family="Arial" font-size="9" text-anchor="middle">name: string</text>
  <text x="755" y="130" font-family="Arial" font-size="9" text-anchor="middle">description: string</text>
  <text x="755" y="145" font-family="Arial" font-size="9" text-anchor="middle">price: decimal(10,2)</text>
  <text x="755" y="160" font-family="Arial" font-size="9" text-anchor="middle">categoria_id: int FK</text>
  <text x="755" y="175" font-family="Arial" font-size="9" text-anchor="middle">is_active: boolean</text>
  <text x="755" y="190" font-family="Arial" font-size="9" text-anchor="middle">is_available: boolean</text>

  <!-- mesas -->
  <rect x="40" y="230" width="150" height="110" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="115" y="250" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">mesas</text>
  <text x="115" y="270" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="115" y="285" font-family="Arial" font-size="9" text-anchor="middle">numero: int UK</text>
  <text x="115" y="300" font-family="Arial" font-size="9" text-anchor="middle">estado: DISPONIBLE/OCUPADA/CERRADA</text>
  <text x="115" y="315" font-family="Arial" font-size="9" text-anchor="middle">public_token: string UK</text>

  <!-- servicios -->
  <rect x="250" y="230" width="160" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="330" y="250" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">servicios</text>
  <text x="330" y="270" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="330" y="285" font-family="Arial" font-size="9" text-anchor="middle">mesa_id: int FK</text>
  <text x="330" y="300" font-family="Arial" font-size="9" text-anchor="middle">abierto_por_id: int FK</text>
  <text x="330" y="300" font-family="Arial" font-size="9" text-anchor="middle">estado: ACTIVO/CERRADO</text>
  <text x="330" y="320" font-family="Arial" font-size="9" text-anchor="middle">estado_activo (generada)</text>
  <text x="330" y="335" font-family="Arial" font-size="9" text-anchor="middle">uq_servicios_una_activa_por_mesa</text>

  <!-- pedidos -->
  <rect x="470" y="230" width="150" height="130" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="545" y="250" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">pedidos</text>
  <text x="545" y="270" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="545" y="285" font-family="Arial" font-size="9" text-anchor="middle">servicio_id: int FK</text>
  <text x="545" y="300" font-family="Arial" font-size="9" text-anchor="middle">origen: MESERO/PUBLICO</text>
  <text x="545" y="315" font-family="Arial" font-size="9" text-anchor="middle">creado_por_id: int FK</text>
  <text x="545" y="330" font-family="Arial" font-size="9" text-anchor="middle">estado: string</text>
  <text x="545" y="345" font-family="Arial" font-size="9" text-anchor="middle">estado_preparacion: string</text>

  <!-- detalles_pedido -->
  <rect x="680" y="230" width="150" height="110" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="755" y="250" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">detalles_pedido</text>
  <text x="755" y="270" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="755" y="285" font-family="Arial" font-size="9" text-anchor="middle">pedido_id: int FK</text>
  <text x="755" y="300" font-family="Arial" font-size="9" text-anchor="middle">producto_id: int FK</text>
  <text x="755" y="300" font-family="Arial" font-size="9" text-anchor="middle">cantidad: int</text>
  <text x="755" y="320" font-family="Arial" font-size="9" text-anchor="middle">precio_unitario: decimal(10,2)</text>

  <!-- pagos -->
  <rect x="40" y="410" width="150" height="110" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="6"/>
  <text x="115" y="430" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">pagos</text>
  <text x="115" y="450" font-family="Arial" font-size="9" text-anchor="middle">id: int PK</text>
  <text x="115" y="465" font-family="Arial" font-size="9" text-anchor="middle">servicio_id: int UK FK</text>
  <text x="115" y="480" font-family="Arial" font-size="9" text-anchor="middle">registrado_por_id: int FK</text>
  <text x="115" y="495" font-family="Arial" font-size="9" text-anchor="middle">importe: decimal(10,2) > 0</text>

  <!-- Relationships -->
  <line x1="115" y1="150" x2="250" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="145" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="330" y1="180" x2="470" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="175" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="545" y1="160" x2="680" y2="120" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="155" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="115" y1="340" x2="250" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="330" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="330" y1="350" x2="470" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="345" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="545" y1="360" x2="680" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="355" font-family="Arial" font-size="10" fill="#666666">1:N</text>

  <line x1="330" y1="350" x2="470" y2="410" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="395" font-family="Arial" font-size="10" fill="#666666">1:1</text>

  <line x1="115" y1="520" x2="470" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="515" font-family="Arial" font-size="10" fill="#666666">1:N</text>
</svg>
