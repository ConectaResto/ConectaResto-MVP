<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">C4 — Diagrama de Contenedores</text>

  <!-- Browser -->
  <rect x="50" y="80" width="200" height="90" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="150" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Navegador web</text>
  <text x="150" y="130" font-family="Arial" font-size="11" text-anchor="middle">Chrome / Edge</text>
  <text x="150" y="150" font-family="Arial" font-size="10" text-anchor="middle">Carga SPA, consume API REST</text>

  <!-- SPA -->
  <rect x="330" y="80" width="220" height="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="440" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">SPA ConectaResto</text>
  <text x="440" y="132" font-family="Arial" font-size="11" text-anchor="middle">HTML5, CSS3, JS Vanilla, Bootstrap 5</text>
  <text x="440" y="154" font-family="Arial" font-size="10" text-anchor="middle">Navegación por hash</text>
  <text x="440" y="176" font-family="Arial" font-size="10" text-anchor="middle">Servida desde /app/</text>

  <!-- Flask App -->
  <rect x="630" y="80" width="220" height="160" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="740" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Aplicación Flask</text>
  <text x="740" y="132" font-family="Arial" font-size="11" text-anchor="middle">Python 3 + Flask 3</text>
  <text x="740" y="154" font-family="Arial" font-size="10" text-anchor="middle">API REST, plantillas Jinja2</text>
  <text x="740" y="176" font-family="Arial" font-size="10" text-anchor="middle">Autenticación, CSRF, sesiones</text>
  <text x="740" y="198" font-family="Arial" font-size="10" text-anchor="middle">Sirve archivos estáticos /app/</text>

  <!-- MySQL -->
  <rect x="330" y="280" width="220" height="120" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="440" y="310" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Base de datos MySQL 8</text>
  <text x="440" y="332" font-family="Arial" font-size="11" text-anchor="middle">MySQL 8 + PyMySQL</text>
  <text x="440" y="354" font-family="Arial" font-size="10" text-anchor="middle">Almacenamiento persistente</text>

  <!-- Filesystem -->
  <rect x="630" y="280" width="220" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
  <text x="740" y="310" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Sistema de archivos</text>
  <text x="740" y="332" font-family="Arial" font-size="11" text-anchor="middle">instance/uploads/products/</text>
  <text x="740" y="354" font-family="Arial" font-size="10" text-anchor="middle">Imágenes de productos</text>

  <!-- Relationships -->
  <line x1="150" y1="170" x2="330" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="160" font-family="Arial" font-size="10" fill="#666666">HTTP fetch</text>

  <line x1="440" y1="200" x2="440" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="235" font-family="Arial" font-size="10" fill="#666666">SQLAlchemy / PyMySQL</text>

  <line x1="650" y1="240" x2="650" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="250" font-family="Arial" font-size="10" fill="#666666">Lectura/escritura</text>

  <line x1="740" y1="200" x2="740" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
