<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="650" viewBox="0 0 950 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">C4 — Diagrama de Componentes</text>

  <!-- Container border -->
  <rect x="40" y="50" width="870" height="560" fill="#fafafa" stroke="#999999" stroke-width="2" rx="8"/>
  <text x="60" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#555555">Aplicación Flask</text>

  <!-- Column 1: Auth, Users, Catalog -->
  <rect x="60" y="100" width="260" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="190" y="125" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">auth</text>
  <text x="190" y="145" font-family="Arial" font-size="10" text-anchor="middle">Login, logout, me, CSRF,</text>
  <text x="190" y="160" font-family="Arial" font-size="10" text-anchor="middle">login_required, roles_required</text>

  <rect x="60" y="220" width="260" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="190" y="245" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">users</text>
  <text x="190" y="265" font-family="Arial" font-size="10" text-anchor="middle">Gestión usuarios/roles (ADMIN),</text>
  <text x="190" y="280" font-family="Arial" font-size="10" text-anchor="middle">seed-demo, siembra datos</text>

  <rect x="60" y="340" width="260" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="190" y="365" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">catalog</text>
  <text x="190" y="385" font-family="Arial" font-size="10" text-anchor="middle">CRUD categorías y productos,</text>
  <text x="190" y="400" font-family="Arial" font-size="10" text-anchor="middle">subida de imágenes</text>

  <!-- Column 2: Mesas, Servicios, Pedidos -->
  <rect x="345" y="100" width="260" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="475" y="125" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">mesas</text>
  <text x="475" y="145" font-family="Arial" font-size="10" text-anchor="middle">Consulta/admin mesas, QR SVG,</text>
  <text x="475" y="160" font-family="Arial" font-size="10" text-anchor="middle">endpoints públicos</text>

  <rect x="345" y="220" width="260" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="475" y="245" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">servicios</text>
  <text x="475" y="265" font-family="Arial" font-size="10" text-anchor="middle">Apertura servicios, caja,</text>
  <text x="475" y="280" font-family="Arial" font-size="10" text-anchor="middle">pago simulado, cierre</text>

  <rect x="345" y="340" width="260" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="475" y="365" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">pedidos</text>
  <text x="475" y="385" font-family="Arial" font-size="10" text-anchor="middle">Creación pedidos, transiciones,</text>
  <text x="475" y="400" font-family="Arial" font-size="10" text-anchor="middle">bloqueo de concurrencia</text>

  <!-- Column 3: Repositorios and DTOs -->
  <rect x="630" y="100" width="260" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="760" y="125" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">servicios.repository</text>
  <text x="760" y="145" font-family="Arial" font-size="10" text-anchor="middle">ServicioRepository</text>

  <rect x="630" y="200" width="260" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="760" y="225" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">servicios.dto</text>
  <text x="760" y="245" font-family="Arial" font-size="10" text-anchor="middle">ServicioDTO</text>

  <rect x="630" y="300" width="260" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="760" y="325" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">pedidos.repository</text>
  <text x="760" y="345" font-family="Arial" font-size="10" text-anchor="middle">PedidoRepository</text>

  <rect x="630" y="400" width="260" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"/>
  <text x="760" y="425" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">pedidos.dto</text>
  <text x="760" y="445" font-family="Arial" font-size="10" text-anchor="middle">PedidoDTO</text>

  <!-- Column 4: Health, Frontend, Common, Models, Config, Extensions -->
  <rect x="60" y="480" width="200" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="160" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">health</text>
  <text x="160" y="525" font-family="Arial" font-size="9" text-anchor="middle">GET /health</text>

  <rect x="280" y="480" width="200" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="380" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">frontend</text>
  <text x="380" y="525" font-family="Arial" font-size="9" text-anchor="middle">Vistas Jinja2, sirve /app/</text>

  <rect x="500" y="480" width="200" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="6"/>
  <text x="600" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">common</text>
  <text x="600" y="525" font-family="Arial" font-size="9" text-anchor="middle">Respuestas JSON, errores</text>

  <rect x="720" y="480" width="190" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="6"/>
  <text x="815" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">models</text>
  <text x="815" y="525" font-family="Arial" font-size="9" text-anchor="middle">ORM SQLAlchemy</text>

  <rect x="60" y="580" width="180" height="50" fill="#eceff1" stroke="#607d8b" stroke-width="2" rx="6"/>
  <text x="150" y="598" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">config</text>
  <text x="150" y="615" font-family="Arial" font-size="9" text-anchor="middle">Entornos dev/test/prod</text>

  <rect x="260" y="580" width="180" height="50" fill="#eceff1" stroke="#607d8b" stroke-width="2" rx="6"/>
  <text x="350" y="598" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">extensions</text>
  <text x="350" y="615" font-family="Arial" font-size="9" text-anchor="middle">db, migrate</text>
</svg>
