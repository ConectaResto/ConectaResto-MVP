{% extends "base.html" %}

{% block title %}Pedidos - Panel Cocina - ConectaResto MVP{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-header">
        <h1>{{ panel_title }}</h1>
        <p class="panel-subtitle">Rol: <strong>{{ user.rol }}</strong> · Usuario: {{ user.username }}</p>
    </div>

    <div class="flash" id="flash-kitchen" style="display:none;"></div>

    <h2 style="margin-bottom:16px; color:#2c3e50;">Pedidos en preparación</h2>
    <div id="pedidos-list">
        <p style="color:#666;">Cargando pedidos...</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    const flashEl = document.getElementById('flash-kitchen');
    const pedidosList = document.getElementById('pedidos-list');

    function showFlash(message, type) {
        flashEl.style.display = 'block';
        flashEl.className = 'flash ' + type;
        flashEl.textContent = message;
    }

    function hideFlash() {
        flashEl.style.display = 'none';
    }

    async function fetchJson(url, options = {}) {
        const headers = { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/json', ...options.headers };
        const response = await fetch(url, { ...options, headers });
        const data = await response.json().catch(() => ({}));
        return { ok: response.ok, status: response.status, data };
    }

    function estadoPrepColor(estado) {
        const map = {
            'RECIBIDO': 'background:#fef9e7;color:#b7950b;',
            'EN_COCINA': 'background:#fdecea;color:#c0392b;',
            'LISTO_PARA_SERVIR': 'background:#e8f6f3;color:#117a65;',
        };
        return map[estado] || '';
    }

    async function loadPedidos() {
        hideFlash();
        const res = await fetchJson('/pedidos');
        if (!res.ok) {
            pedidosList.innerHTML = '<p style="color:#c0392b;">Error al cargar pedidos.</p>';
            return;
        }
        const pedidos = res.data.data || res.data || [];
        if (pedidos.length === 0) {
            pedidosList.innerHTML = '<p style="color:#666;">No hay pedidos en preparación.</p>';
            return;
        }
        let html = '<table style="width:100%; border-collapse:collapse; margin-top:12px;"><thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Pedido</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Servicio</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Estado</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Preparación</th><th style="text-align:right;padding:8px;border-bottom:2px solid #ddd;">Total</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Acciones</th></tr></thead><tbody>';
        for (const p of pedidos) {
            html += '<tr><td style="padding:8px;border-bottom:1px solid #eee;">#' + p.id + '</td>';
            html += '<td style="padding:8px;border-bottom:1px solid #eee;">#' + p.servicio_id + '</td>';
            html += '<td style="padding:8px;border-bottom:1px solid #eee;"><span style="padding:4px 8px;border-radius:4px;font-size:0.85rem;background:#fef9e7;color:#b7950b;">' + p.estado + '</span></td>';
            html += '<td style="padding:8px;border-bottom:1px solid #eee;"><span style="padding:4px 8px;border-radius:4px;font-size:0.85rem;' + estadoPrepColor(p.estado_preparacion) + '">' + p.estado_preparacion + '</span></td>';
            html += '<td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">$' + p.total + '</td>';
            html += '<td style="padding:8px;border-bottom:1px solid #eee;">';
            if (p.estado_preparacion === 'RECIBIDO') {
                html += '<button class="btn btn-primary" style="padding:6px 12px;font-size:0.85rem;" onclick="cambiarPreparacion(' + p.id + ', \'EN_COCINA\')">En cocina</button>';
            }
            if (p.estado_preparacion === 'EN_COCINA') {
                html += '<button class="btn btn-primary" style="padding:6px 12px;font-size:0.85rem;" onclick="cambiarPreparacion(' + p.id + ', \'LISTO_PARA_SERVIR\')">Listo para servir</button>';
            }
            html += '</td></tr>';
        }
        html += '</tbody></table>';
        pedidosList.innerHTML = html;
    }

    window.cambiarPreparacion = async function(pedidoId, nuevoEstado) {
        hideFlash();
        const res = await fetchJson('/pedidos/' + pedidoId + '/preparacion', {
            method: 'PATCH',
            body: JSON.stringify({ estado: nuevoEstado }),
        });
        if (res.ok) {
            const msg = nuevoEstado === 'EN_COCINA' ? 'en cocina' : 'listo para servir';
            showFlash('Pedido #' + pedidoId + ' ' + msg, '');
            flashEl.style.backgroundColor = '#e8f6f3';
            flashEl.style.color = '#117a65';
            flashEl.style.border = '1px solid #a9dfbf';
            loadPedidos();
        } else {
            showFlash(res.data.error || 'Error al actualizar preparación', 'error');
        }
    };

    loadPedidos();
});
</script>
{% endblock %}
